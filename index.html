<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>KitchenTablet | טאבלט המתכונים המשפחתי</title>
    <meta
      name="description"
      content="טאבלט ייעודי למתכונים בלי הסחות דעת, שהופך למסגרת תמונות חיה של המשפחה. 649 ₪ כולל מעמד מגנטי, 50 מתכוני בסיס ומשלוח חינם."
    />
    <script>
      // Apply the saved language before first paint so the page never flashes the wrong direction.
      try {
        var saved = localStorage.getItem('kt-lang')
        if (saved === 'en' || saved === 'fr') {
          document.documentElement.lang = saved
          document.documentElement.dir = 'ltr'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
